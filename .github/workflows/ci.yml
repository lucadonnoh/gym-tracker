name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:frontend:ts
      - run: npm test
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e

# Deployment is handled by Coolify's auto-deploy on push
# (GitHub Actions can't reach local Coolify instance)
