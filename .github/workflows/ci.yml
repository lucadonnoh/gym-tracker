name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install chromium --with-deps
      - run: npm run seed
        env:
          DATABASE_PATH: test-e2e.db
      - run: npm run test:e2e

# Pushing does not deploy: production images are built by hand on the rpi.
