name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:frontend
      - run: npm test

  deploy-staging:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging
        run: |
          curl -X POST '${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.STAGING_UUID }}&force=true' \
            -H 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'

  deploy-production:
    needs: deploy-staging
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to Production
        run: |
          curl -X POST '${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.PROD_UUID }}&force=true' \
            -H 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}'
